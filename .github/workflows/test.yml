name: Test Suite

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run integration tests
        run: python3 -m pytest tests/integration/ -v

  solidity-parity:
    name: Solidity Parity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo add-apt-repository ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc
      - name: Run solidity parity tests
        run: python3 -m pytest tests/solidity_parity/ -v

  verification:
    name: Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Install Dafny
        run: dotnet tool install --global dafny
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run verification tests
        run: python3 -m pytest tests/verification/ -v

  foundry:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run foundry tests
        run: |
          cd tests/foundry
          forge test -vv
